[package]
name = "link-opener"
version = "0.3.1"
description = "Browser-independent bookmark library and link opener"
authors = ["hseyeved"]
license = "GPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "link_opener_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
thiserror = "2.0.21"
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "http2", "gzip", "brotli"] }
scraper = "0.27.0"
sha2 = "0.11.0"
tauri-plugin-dialog = "2"
base64 = "0.23.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.10.1"

[dev-dependencies]
plist = "1.10.1"
tempfile = "3.27.0"

# TLS for metadata fetching: the OS's own TLS on Windows/macOS (no C toolchain needed;
# ring needs clang on ARM64 Windows), rustls + ring on Linux (no OpenSSL dependency).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
