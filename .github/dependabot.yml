# Weekly dependency update PRs, grouped so each ecosystem gets one PR for minor/patch updates.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # SvelteKit and svelte-check only support TypeScript 5 and 6 so far (7 is the new Go
      # compiler). Remove this once they accept "typescript": "^7".
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
