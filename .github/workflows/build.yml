# Tests on every push/PR. Installers for Windows, macOS and Linux only for version tags
# (v0.2.0 etc.), which also create a draft GitHub release, or when run by hand from the
# Actions tab ("Run workflow"), which just attaches them to the run.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Type-check frontend
        run: npm run check

      # Catches production-build breakage early (the installer jobs build it again).
      - name: Build frontend
        run: npm run build

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      # Every Rust dependency must be compatible with the GPL; see src-tauri/deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
          manifest-path: src-tauri/Cargo.toml

  # Creates the draft release once, before the long builds: a token without write access
  # fails here in seconds, and the parallel installer jobs can't each create their own draft.
  release:
    name: Draft release
    needs: [test, licenses]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the draft release (if it doesn't exist yet)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Link Opener $TAG" \
              --notes "Installers for Windows (x64 and ARM64), macOS (universal) and Linux (AppImage, deb, rpm). See CHANGELOG.md for what's new."
          fi

  build:
    name: Installers (${{ matrix.name }})
    needs: [test, licenses, release]
    # On a tag, after the draft release exists; on a manual run, the release job is skipped.
    if: >-
      !cancelled()
      && needs.test.result == 'success'
      && needs.licenses.result == 'success'
      && (startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success'
          || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write # upload installers to the draft release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rust-targets: ""
            args: ""
          - name: Windows ARM64
            os: windows-latest
            rust-targets: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc
          - name: macOS universal
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            rust-targets: ""
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - run: npm ci

      # On a v* tag this uploads to the draft release made by the release job; on a manual
      # run it only builds.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseDraft: true
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v7
        with:
          name: Link Opener ${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
